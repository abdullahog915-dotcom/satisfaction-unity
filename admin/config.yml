backend:
  name: github
  repo: abdullahog915-dotcom/satisfaction-unity
  branch: main
  base_url: https://su-cms-auth.satisfactionunity-in.workers.dev
  auth_endpoint: auth

media_folder: "assets/products"
public_folder: "/assets/products"

publish_mode: simple
locale: en

collections:

  # PRODUCTS
  - name: products
    label: Products
    files:
      - file: data/products.json
        label: Product Catalog
        name: products
        fields:
          - label: Products
            name: products
            widget: list
            summary: "{{fields.name}}"
            fields:

              - label: ID
                name: id
                widget: string

              - label: Product Name
                name: name
                widget: string

              - label: Category
                name: category
                widget: select
                options:
                  - Table Lamps
                  - vase

              - label: Price (INR)
                name: price
                widget: number
                value_type: int

              - label: Description
                name: description
                widget: text

              - label: Images
                name: images
                widget: list
                field:
                  label: Image
                  name: image
                  widget: image

              - label: Material
                name: material
                widget: select
                options:
                  - metal
                  - brass
                  - aluminium
                  - iron
                  - glass
                  - ceramic

              - label: In Stock
                name: inStock
                widget: boolean
                default: true

  # HOMEPAGE BANNER
  - name: banner
    label: Homepage Banner
    files:
      - file: data/banner.json
        label: Banner Slides
        name: banner
        fields:
          - label: Slides
            name: slides
            widget: list
            summary: "{{fields.type}}"
            fields:

              - label: Type
                name: type
                widget: select
                options:
                  - image
                  - video

              - label: Image
                name: image
                widget: image
                required: false

              - label: Video
                name: video
                widget: file
                required: false

  # SITE SETTINGS
  - name: settings
    label: Site Settings
    files:
      - file: data/settings.json
        label: General Settings
        name: settings
        fields:

          - label: Business Name
            name: businessName
            widget: string

          - label: Address
            name: address
            widget: text

          - label: Phone
            name: phone
            widget: string

          - label: WhatsApp Number
            name: whatsapp
            widget: string

          - label: Email
            name: email
            widget: string
